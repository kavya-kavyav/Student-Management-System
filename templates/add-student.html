

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Student Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        /* Form Card */

        .card {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.8s ease;
        }

        .card h1 {
            text-align: center;
            color: #3549a5;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* Input Groups */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #444;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fafbff;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #aaa;
        }

        /* Submit Button */

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #536dfe, #764ba2);
            color: white;
            font-size: 16px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(83,109,254,0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Back Link */

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #536dfe;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Animation */

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
            }

            .card h1 {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>Add Student</h1>
        <p class="subtitle">
            Enter student details to register a new student
        </p>
        <form action="/students/add" method="post">
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter student name" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age"
                       placeholder="Enter age" min="1" max="100" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="marks">Marks</label>
                <input type="number" id="marks" name="marks"
                       placeholder="Enter marks" min="0" required>
            </div>
            <div class="form-group">
                <label for="course">Course</label>
                <input type="text" id="course" name="course"
                       placeholder="Enter course name" required>
            </div>
            <div class="form-group">
                <label for="image">Student Image URL</label>
                <input type="url" id="image" name="image"
                       placeholder="Paste image URL">
            </div>
            <div class="form-group">
                <label for="status">Attendance Status</label>
                <select id="status" name="status" required>
                    <option value="">Select Attendance</option>
                    <option value="0">Absent</option>
                    <option value="1">Present</option>
                </select>
            </div>
            <button type="submit">+ Add Student</button>
        </form>
        <a href="/" class="back">
            ← Back to Student List
        </a>
    </div>
</body>
</html>
